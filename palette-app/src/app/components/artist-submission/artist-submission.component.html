<app-tool-bar></app-tool-bar>

<div #f="ngForm" [formGroup]="submitArtistForm" class="form-container">
  <p class="form-group">
    <label>Name:</label>
    <input type="text" formControlName="name" placeholder="Enter artist name">
  </p>
  <p class="form-group">
    <label>Email:</label>
    <input type="text" formControlName="email" placeholder="Enter artist email">
  </p>
  <p class="form-group">
    <label>Class:</label>
    <input type="text" formControlName="class" placeholder="Enter class">
  </p>
  <p class="form-group">
    <label>Major:</label>
    <input type="text" formControlName="major" placeholder="Enter major">
  </p>
  <p class="form-group">
    <label>Interests:</label>
    <input type="text" formControlName="interests" placeholder="Enter one or more interests">
  </p>
  <p class="form-group">
    <label>Thumbnail Image Upload:</label>
    <input type="file" formControlName="image" (change)="uploadImage($event)">
  </p>

  <p class="submit-button">
    <button type="submit" (click)="onSubmit()" [disabled] = "!submitArtistForm.valid"> Submit Artist</button>

    @if (formData){
      <h2>Submitted Data:</h2>
      <p>{{formData | json}}</p>
    }
  </p>
</div>
