<app-tool-bar></app-tool-bar>

@let artistDetail = currArtist$();
@if (artistDetail){
    <div class="artist">
        <div class="art-desc">
            <h3>{{artistDetail.name}}</h3>
            <p>{{ artistDetail.class }}</p>
            <p>Email: {{ artistDetail.email }}</p>
            <p>Major: {{ artistDetail.major }}</p>
            <p>Interests: {{ artistDetail.interests }}</p>
        </div>
    </div>
}

<app-artwork-card></app-artwork-card>
