<app-tool-bar></app-tool-bar>
<div #f="ngForm" [formGroup]="submitArtForm" class="form-container">
  <p class="required-text">* indicates required</p>
  <p class="form-group">
    <label>Title: <span class="required">*</span></label>
    <input type="text" formControlName="title" placeholder="Enter artwork title">
  </p>
  <p class="form-group">
    <label>Image Upload: <span class="required">*</span></label>
    <input type="file" formControlName="image" (change)="uploadImage($event)">
  </p>
  <p class="form-group">
    <label>Year: <span class="required">*</span></label>
    <input type="text" formControlName="year" placeholder="Enter year">
  </p>
  <p class="form-group">
    <label>Artist: <span class="required">*</span></label>
    <input type="text" formControlName="artist" placeholder="Enter artist name">
  </p>
  <p class="form-group">
    <label>Medium:</label>
    <input type="text" formControlName="medium" placeholder="Enter medium">
  </p>
  <p class="form-group">
    <label>Dimensions:</label>
    <input type="text" formControlName="dimensions" placeholder="Enter dimensions">
  </p>
  <p class="form-group">
    <label>Price:</label>
    <input type="text" formControlName="price" placeholder="Enter price">
  </p>
  <p class="form-group">
    <label>Description:</label>
    <textarea formControlName="description" placeholder="Enter description"></textarea>
  </p>
  <p class="form-group">
    <label>Category: <span class="required">*</span></label>
    <input type="text" formControlName="category" placeholder="example: paintings, photography, ...">
  </p>

  <!-- the submit button is disabled until all the required fields are filled in with valid inputs -->
  <p class="submit-button">
    <button type="submit" (click)="onSubmit()" [disabled]="!submitArtForm.valid"> Submit </button>
  </p>
</div>
